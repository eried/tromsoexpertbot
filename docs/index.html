<script>
const STATUS_URL = "https://check.ried.no/";
const WEATHER_URL = "https://check.ried.no/weather.json";
const POLL_MS = 60 * 1000;
const WATER = 0.2, WL = 1 - WATER;

// Intensity levels, one notch calmer than the photos look: faint is a soft green patch low in the north-east
const LEVELS = {
  1: { name: "Faint", energy: .26, spot: 1, w: [1, 0, 0, 0], lead: "A hint of green low in the north-east. Find a dark spot and give it time." },
  2: { name: "Moderate", energy: .5, spot: 0, w: [1, 0, 0, 0], lead: "A calm arc across the north. Look north-east, above the mountains." },
  3: { name: "Strong", energy: .72, spot: 0, w: [0, 1, 0, 0], lead: "Clear curtains, visible from town. Go outside." },
  4: { name: "Very strong", energy: .9, spot: 0, w: [0, .45, .55, 0], lead: "Bright curtains and a corona forming overhead. Go out now." },
};
// sky codes from status.txt: 0 clear, 1 partly cloudy, 2 overcast, 3 rain, 4 snow, 5 storm
const SKY = [
  { label: "Clear", cloud: 0, lit: 0, kind: "", wind: 3 },
  { label: "Partly cloudy", cloud: .45, lit: .25, kind: "", wind: 6 },
  { label: "Overcast", cloud: .96, lit: .45, kind: "", wind: 8 },
  { label: "Rain", cloud: .95, lit: .35, kind: "rain", wind: 9 },
  { label: "Snow", cloud: .9, lit: 1, kind: "snow", wind: 5 },
  { label: "Storm", cloud: .98, lit: .3, kind: "rain", wind: 24 },
];

// ---------- Tromsø panorama (x across, y from the top; the water line is at y = 0.8) ----------
const L = {
  ridges: [
    { d: 0, snow: .3, pts: [[-.02, .74], [.1, .705], [.2, .69], [.3, .71], [.38, .755], [.45, .8]] },
    { d: 0, snow: .5, pts: [[.33, .8], [.42, .68], [.48, .6], [.52, .555], [.56, .59], [.62, .66], [.7, .73], [.76, .78]] },
    { d: 1, snow: .2, pts: [[.66, .8], [.71, .73], [.75, .64], [.79, .6], [.86, .585], [.95, .58], [1.02, .585]] },
    { d: 2, pts: [[.4, .8], [.5, .78], [.6, .775], [.68, .785], [.74, .8]] },
  ],
  island: [[-.02, .78], [.12, .772], [.25, .772], [.33, .785], [.36, .8]],
  bridge: { x0: .35, x1: .6, rise: .04 }, cath: { x: .63, h: .06 },
  houses: [{ x0: .01, x1: .34, on: "island", n: 200 }, { x0: .44, x1: .64, on: 3, n: 45 }, { x0: .7, x1: .98, on: 2, n: 35, below: .05 }],
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function smoothPath(ctx, pts) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[Math.max(0, i - 1)], [x1, y1] = pts[i], [x2, y2] = pts[i + 1], [x3, y3] = pts[Math.min(pts.length - 1, i + 2)];
    ctx.bezierCurveTo(x1 + (x2 - x0) / 6, y1 + (y2 - y0) / 6, x2 - (x3 - x1) / 6, y2 - (y3 - y1) / 6, x2, y2);
  }
}
function lineY(line, x) {
  for (let i = 0; i < line.length - 1; i++) if (x >= line[i][0] && x <= line[i + 1][0]) {
    const t = (x - line[i][0]) / (line[i + 1][0] - line[i][0]); return line[i][1] + (line[i + 1][1] - line[i][1]) * t;
  }
  return line[line.length - 1][1];
}
const town = (() => {
  const r = rng(1972), houses = [], lights = [];
  const DAY = ["#8b9097", "#767c84", "#a2a7ad", "#d8d5ce", "#cfcac0", "#7a2f2b", "#8e3b33", "#6b2a26"];
  for (const z of L.houses) {
    const line = z.on === "island" ? L.island : L.ridges[z.on].pts;
    for (let i = 0; i < z.n; i++) {
      const x = z.x0 + r() * (z.x1 - z.x0);
      const top = Math.max(lineY(line, x), z.below ? WL - z.below : 0) + .006;
      const y = top + (WL - .003 - top) * Math.pow(r(), 1.4);
      const w = .006 + r() * .008, h = .005 + r() * .006;
      houses.push({ x, y, w, h, roof: h * (.5 + r() * .4), color: DAY[Math.floor(r() * DAY.length)] });
      const nWin = r() < .75 ? 1 + Math.floor(r() * 2) : 0;
      for (let k = 0; k < nWin; k++) lights.push({ x: x + (r() - .5) * w * .6, y: y - h * (.3 + r() * .4), size: .5 + r() * .5, warm: r() > .15, ph: r() * 6.28, f: .6 + r() * 2.2, base: .55 + r() * .45 });
    }
    for (let i = 0; i < z.n / 3; i++) lights.push({ x: z.x0 + r() * (z.x1 - z.x0), y: WL - r() * .004, size: .6 + r() * .6, warm: true, ph: r() * 6.28, f: .4 + r() * 1.2, base: .7 + r() * .3, street: true });
  }
  for (let i = 1; i < 12; i++) lights.push({ bridgeT: i / 12, size: .7, warm: true, ph: i, f: .3, base: .9 });
  houses.sort((a, b) => a.y - b.y);
  lights.forEach((l, i) => { l.blink = !l.street && l.bridgeT === undefined && i % 97 === 13; });
  return { houses, lights };
})();
let cathPath = null;
const DEPTH = { night: ["rgba(20,32,44,0.92)", "rgba(11,19,28,0.95)", "rgba(5,9,14,0.97)"], day: ["rgba(122,140,160,0.88)", "rgba(90,106,124,0.92)", "rgba(66,78,92,0.95)"] };
// On narrow (portrait) screens the landscape keeps its proportions and the sides are cropped, like a photo
const landWidth = (W, H) => Math.max(W, Math.round(H * 1.6));
// keep the peak and the cathedral in view when cropping
const landOffset = (W0, W) => Math.min(0, Math.max(W0 - W, W0 / 2 - W * .57));
function drawLand(target, W0, H, night) {
  const W = landWidth(W0, H), OX = landOffset(W0, W);
  const wl = H * WL;
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const ctx = off.getContext("2d");
  const shape = (pts, x0, x1) => { ctx.beginPath(); smoothPath(ctx, pts.map(([x, y]) => [x * W, y * H])); ctx.lineTo(W * x1, wl); ctx.lineTo(W * x0, wl); ctx.closePath(); };
  for (const rd of [...L.ridges].sort((a, b) => a.d - b.d)) {
    const xs = rd.pts.map(p => p[0]), x0 = Math.min(...xs), x1 = Math.max(...xs);
    shape(rd.pts, x0, x1); ctx.fillStyle = (night ? DEPTH.night : DEPTH.day)[rd.d]; ctx.fill();
    if (rd.snow) {
      const peak = Math.min(...rd.pts.map(p => p[1])) * H, snowLine = peak + (wl - peak) * rd.snow;
      ctx.save(); shape(rd.pts, x0, x1); ctx.clip();
      const g = ctx.createLinearGradient(0, peak, 0, snowLine), c = night ? "175,190,210" : "244,247,250", a = night ? .16 : .85;
      g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(.75, `rgba(${c},${a * .55})`); g.addColorStop(1, `rgba(${c},0)`);
      ctx.fillStyle = g; ctx.fillRect(0, peak, W, snowLine - peak); ctx.restore();
    }
  }
  shape(L.island, 0, Math.max(...L.island.map(p => p[0]))); ctx.fillStyle = night ? "rgba(5,9,14,0.97)" : "rgba(66,78,92,0.94)"; ctx.fill();
  for (const hs of town.houses) {
    const x = hs.x * W, y = hs.y * H, w = hs.w * W, h = hs.h * H, roof = hs.roof * H;
    ctx.fillStyle = night ? "rgba(3,6,10,0.9)" : hs.color; ctx.fillRect(x - w / 2, y - h, w, h);
    ctx.fillStyle = night ? "rgba(3,6,10,0.9)" : "rgba(40,44,50,0.85)";
    ctx.beginPath(); ctx.moveTo(x - w * .56, y - h); ctx.lineTo(x, y - h - roof); ctx.lineTo(x + w * .56, y - h); ctx.closePath(); ctx.fill();

  target.wind = live.weather?.wind ?? wx.wind;
  if (live.detected && lvl) { target.energy = lvl.energy; target.w = lvl.w; target.spot = lvl.spot; }
  else { target.energy = 0; target.w = [1, 0, 0, 0]; target.spot = 0; }
}
function parseStatus(text) {
  const kv = {};
  for (const line of text.split("\n")) { const i = line.indexOf("="); if (i > 0) kv[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
  return kv;

async function poll() {
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const kv = parseStatus(await res.text());
    if (!kv.ts) throw new Error("empty status");
    Object.assign(fetched, { ok: true, ts: +kv.ts, dark: +kv.dark || 0, detected: +kv.detected || 0, count: +kv.count || 0, cameras: +kv.cameras || 7,
      intensity: Math.min(4, +kv.intensity || (+kv.detected ? 2 : 0)), sky: Math.min(5, +kv.sky || 0) });
  } catch { fetched.ok = false; }

    const ct = res.headers.get("content-type") || "";
    fetched.weather = res.ok && ct.includes("json") ? await res.json() : null;
  } catch { fetched.weather = null; }

}

  // place the invisible cathedral button over the drawn cathedral (CSS pixels)
  const cw = innerWidth, chh = innerHeight, vw = landWidth(cw, chh), ox = landOffset(cw, vw), ch = L.cath.h * chh;
  Object.assign($("cathedral").style, { left: `${L.cath.x * vw + ox - ch * .7}px`, top: `${chh * WL - ch * 1.1}px`, width: `${ch * 1.6}px`, height: `${ch * 1.15}px` });
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!document.hidden) {
    if (!reduce) simT += dt;
    const k = Math.min(1, dt * .9);
    for (const key of ["energy", "dark", "cloud", "wind", "lit", "spot", "thick"]) cur[key] += (target[key] - cur[key]) * k;
    pulseClock += dt;
    pulseMix += ((live.detected && live.intensity >= 3 ? .4 * Math.max(0, Math.sin(pulseClock * .11)) : 0) - pulseMix) * k;
    const w = target.w.map((v, i) => (cur.w[i] += (v - cur.w[i]) * k));
    drawWx(dt);
    drawLights(glow.getContext("2d"), glow.width, glow.height, cur.dark, reduce ? null : simT);
    if (gl) {
      gl.uniform2f(uni.res, sky.width, sky.height); gl.uniform1f(uni.t, simT);
      gl.uniform1f(uni.energy, cur.energy); gl.uniform1f(uni.dark, cur.dark); gl.uniform1f(uni.water, WATER);
      gl.uniform1f(uni.cloud, cur.cloud); gl.uniform1f(uni.wind, cur.wind); gl.uniform1f(uni.flash, flash);
      gl.uniform1f(uni.lit, cur.lit); gl.uniform1f(uni.spot, cur.spot); gl.uniform1f(uni.thick, cur.thick);
      gl.uniform4f(uni.w, w[0], w[1], w[2], Math.max(w[3], pulseMix));
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }
  requestAnimationFrame(frame);
}

// ---------- background music, off until the visitor turns it on ----------
const music = $("music"), sound = $("sound");
music.volume = .18;
fetch("background.mp3", { method: "HEAD" }).then(r => { if (r.ok) sound.hidden = false; }).catch(() => {});
sound.addEventListener("click", async () => {
  if (music.paused) { try { await music.play(); sound.setAttribute("aria-pressed", "true"); } catch {} }
  else { music.pause(); sound.setAttribute("aria-pressed", "false"); }
});

// details card: shows while hovering or focusing the answer; a tap pins it open
let tipPinned = false;
const showTip = (on) => $("tip").classList.toggle("open", on || tipPinned);
$("answer").addEventListener("mouseenter", () => showTip(true));
$("answer").addEventListener("mouseleave", () => showTip(false));
$("answer").addEventListener("focus", () => showTip(true));
$("answer").addEventListener("blur", () => showTip(false));
$("answer").addEventListener("click", () => { tipPinned = !tipPinned; showTip(tipPinned); });
// secret: 10 taps on the Arctic Cathedral within 4 seconds opens the debug panel
let taps = [];
$("cathedral").addEventListener("click", () => {
  const now = performance.now(); taps = taps.filter(t => now - t < 4000); taps.push(now);
  if (taps.length >= 10) { taps = []; $("debug").hidden = false; syncDebug(); }
});
const dbg = { state: "live", intensity: 2, sky: 0 };
function syncDebug() {
  for (const [id, val] of [["dbgState", dbg.state], ["dbgInt", String(dbg.intensity)], ["dbgSky", String(dbg.sky)]])
    $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === val));
  $("dbgInt").querySelectorAll("button").forEach(b => b.disabled = dbg.state !== "aurora");
  $("dbgSky").querySelectorAll("button").forEach(b => b.disabled = dbg.state === "live");
}
function applyDebug() {
  if (dbg.state === "live") override = null;
  else {
    const aurora = dbg.state === "aurora";
    override = { ok: true, ts: Math.floor(Date.now() / 1000), dark: dbg.state === "day" ? 0 : 1, detected: aurora ? 1 : 0,
      intensity: aurora ? dbg.intensity : 0, count: aurora ? [0, 1, 2, 3, 5][dbg.intensity] : 0, sky: dbg.sky, weather: null };
  }
  syncDebug(); applyState();
}
for (const [id, key] of [["dbgState", "state"], ["dbgInt", "intensity"], ["dbgSky", "sky"]])
  $(id).addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b || b.disabled) return; dbg[key] = key === "state" ? b.dataset.v : +b.dataset.v; applyDebug(); });
$("debugClose").addEventListener("click", () => { $("debug").hidden = true; dbg.state = "live"; applyDebug(); });
// side rail: on touch screens the first tap only brightens it, so links are never hit blind
$("rail").addEventListener("click", (e) => {
  const r = $("rail");
  if (matchMedia("(hover: none)").matches && !r.classList.contains("lit")) {
    e.preventDefault(); r.classList.add("lit"); clearTimeout(r.dim); r.dim = setTimeout(() => r.classList.remove("lit"), 4000);
  }
});
// build date: GitHub Pages sets Last-Modified when the page is deployed (same as eucviewer.ried.no)
(() => {
  const d = new Date(document.lastModified);
  $("page-version").textContent = "build " + (isNaN(d.getTime()) ? document.lastModified : d.toISOString().slice(0, 16).replace("T", " "));
})();
addEventListener("resize", resize);
resize(); render(); poll();
setInterval(poll, POLL_MS);
setInterval(() => { $("checked").textContent = agoText(); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
requestAnimationFrame(frame);
</script>
